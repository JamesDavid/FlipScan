<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipScan</title>
<style>
  :root { --bg:#f5f5f4; --panel:#fff; --line:#e7e5e4; --ink:#1c1917; --dim:#78716c;
          --accent:#0d9488; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:grid; grid-template-columns: 260px 1fr; height:100vh; }
  aside { background:#292524; color:#fafaf9; padding:1rem; overflow-y:auto; }
  aside h1 { font-size:1.1rem; margin:0 0 1rem; }
  .proj { padding:.5rem .7rem; border-radius:6px; cursor:pointer; margin-bottom:.25rem;
          font-size:.9rem; }
  .proj:hover, .proj.active { background:#44403c; }
  .proj .sub { font-size:.75rem; color:#a8a29e; }
  main { overflow-y:auto; padding:1.5rem 2rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:1.25rem 1.5rem; margin-bottom:1.25rem; }
  h2 { margin:.2rem 0 1rem; font-size:1.05rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:.45rem .9rem; cursor:pointer; font-size:.85rem; }
  button.secondary { background:#57534e; }
  button:disabled { opacity:.5; cursor:default; }
  .stages { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.8rem; }
  .stage { padding:.25rem .6rem; border-radius:999px; font-size:.75rem;
           background:#f3f4f6; color:#374151; }
  .stage.done { background:#dcfce7; color:#166534; }
  #log { background:#1c1917; color:#d6d3d1; font-family:ui-monospace,monospace;
         font-size:.75rem; padding: .8rem 1rem; border-radius:6px; max-height:220px;
         overflow-y:auto; white-space:pre-wrap; display:none; }
  #progress { display:none; margin:.8rem 0 .2rem; }
  .ptrack { background:#e7e5e4; border-radius:999px; height:14px; overflow:hidden; }
  .pfill { background:var(--accent); height:100%; width:0; border-radius:999px;
           transition: width .6s ease; }
  .plabel { display:flex; justify-content:space-between; font-size:.8rem;
            color:var(--dim); margin-top:.35rem; }
  .stage.active { background:#ccfbf1; color:#0f766e; outline:2px solid var(--accent); }
  .tabs { display:flex; gap:.25rem; margin-bottom:1rem; }
  .tab { padding:.4rem .9rem; border-radius:6px 6px 0 0; cursor:pointer; font-size:.85rem;
         background:#e7e5e4; }
  .tab.active { background:var(--panel); border:1px solid var(--line); border-bottom:0; }
  .pagerow { display:grid; grid-template-columns: 300px 1fr; gap:1rem; padding:1rem 0;
             border-top:1px solid var(--line); }
  .pagerow img { width:100%; border:1px solid var(--line); border-radius:4px; }
  .pagerow.suspect { background:#fef2f2; }
  .pagegrid { display:grid; grid-template-columns: minmax(240px, 340px) 1fr;
              gap:1rem; margin-top:.6rem; }
  .pagegrid > div:last-child { display:flex; flex-direction:column; }
  .pagegrid textarea { flex:1 1 auto; min-height:200px; }  /* fill the cell */
  .card.suspect { border-left:4px solid var(--bad); }
  .card.duplicate { opacity:.75; }
  .card.deleted { opacity:.55; }
  .meta { font-size:.75rem; color:var(--dim); margin-bottom:.4rem; }
  textarea { width:100%; min-height:200px; font-family:ui-monospace,monospace;
             font-size:.8rem; border:1px solid var(--line); border-radius:6px; padding:.6rem; }
  input, select { border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem;
                  font-size:.85rem; width:100%; margin-bottom:.5rem; }
  label { font-size:.75rem; color:var(--dim); }
  .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .grid3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:.5rem; }

  img, input, select, textarea { max-width:100%; }
  .page > div, .pagerow > div { min-width:0; }

  html, body { max-width:100%; overflow-x:hidden; }

  /* ---- phones & small tablets ---- */
  @media (max-width: 820px) {
    main { overflow-x:hidden; }
    .row > * { min-width:0; }        /* let selects/labels shrink & wrap */
    .row input[type="file"] { width:100%; }
    .row select { max-width:100%; }
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { display:flex; align-items:center; gap:.6rem; padding:.55rem .8rem;
            overflow-x:auto; white-space:nowrap; }
    aside h1 { margin:0; font-size:1rem; flex:none; }
    #projects { display:flex; gap:.4rem; }
    .proj { flex:none; margin:0; padding:.35rem .7rem; }
    .proj .sub { display:none; }
    aside > div:last-child { margin:0 !important; flex:none; }
    main { padding:.8rem; }
    .card { padding:1rem; margin-bottom:.8rem; border-radius:10px; }
    .page, .pagerow, .pagegrid { grid-template-columns:1fr; gap:.8rem; }
    .tabs { overflow-x:auto; }
    .tab { flex:none; padding:.55rem 1rem; }
    button { padding:.6rem 1.1rem; font-size:.9rem; }   /* finger-sized */
    input, select { padding:.55rem .7rem; font-size:16px; } /* stops iOS zoom-on-focus */
    textarea { min-height:150px; font-size:16px; }
    #log { max-height:150px; }
    .thumbs img { height:110px; }
  }
  .badge { font-size:.7rem; padding:.1rem .45rem; border-radius:999px; }
  .badge.suspect { background:#fee2e2; color:var(--bad); }
  .badge.ok { background:#dcfce7; color:#166534; }
  .badge.patched { background:#dbeafe; color:#1d4ed8; }
  .badge.duplicate { background:#fef9c3; color:#854d0e; }
  .pagerow.duplicate { opacity:.55; }
  .badge.deleted { background:#f3f4f6; color:#6b7280; text-decoration:line-through; }
  .pagerow.deleted { opacity:.35; }
  button.danger { background:#dc2626; }
  .thumbs { display:flex; flex-wrap:wrap; gap:.6rem; }
  .thumbs img { height:160px; border:1px solid var(--line); border-radius:4px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<aside>
  <h1>FlipScan</h1>
  <div id="global-status" style="display:none;background:#0d9488;color:#fff;
       border-radius:999px;padding:.3rem .8rem;font-size:.75rem;margin-bottom:.8rem;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  <div id="projects"></div>
  <div style="margin-top:1rem; display:flex; gap:.4rem">
    <button class="secondary" onclick="showNew()">+ New project</button>
    <button class="secondary" onclick="showSettings()" title="Settings">⚙</button>
  </div>
</aside>
<main id="main"><div class="card">Select or create a project.</div></main>

<script>
let current = null;
const $ = (id) => document.getElementById(id);
const api = async (path, opts) => {
  const r = await fetch("/api" + path, opts);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
};
const esc = (s) => (s || "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function refreshProjects() {
  const list = await api("/projects");
  $("projects").innerHTML = list.map(p => `
    <div class="proj ${p.name === current ? "active" : ""}" onclick="openProject('${p.name}')">
      <div>${esc(p.title || p.name)} ${p.running ? "⏳" : ""}</div>
      <div class="sub">${p.pages} pages · ${p.suspects} suspect</div>
    </div>`).join("") || '<div class="sub" style="color:#a8a29e">no projects yet</div>';
  if (!current && list.length) {
    const h = location.hash.slice(1).split("/").map(decodeURIComponent);  // #project/tab
    const name = list.some(p => p.name === h[0]) ? h[0] : list[0].name;
    openProject(name, h[1] || undefined);
  }
}

function showNew() {
  current = null;
  $("main").innerHTML = `
  <div class="card">
    <h2>New project</h2>
    <label>Project name</label><input id="np-name" placeholder="mybook">
    <label>Title (EPUB metadata)</label><input id="np-title">
    <label>Expected pages (optional)</label><input id="np-pages" type="number">
    <div id="np-videos"></div>
    <div class="row" style="margin:.5rem 0">
      <button class="secondary" onclick="addVideoRow()">+ add video</button>
    </div>
    <button onclick="createProject()">Create</button>
    <div class="meta" style="margin-top:.5rem">Upload one or more flip-through videos —
    any direction, any subset of pages. Pages captured in more than one video are merged
    automatically and the sharpest capture wins; you can keep adding videos later until
    every page is covered.</div>
  </div>`;
  addVideoRow();
}

async function showSettings() {
  current = null;
  const s = await api("/settings");
  $("main").innerHTML = `
  <div class="card">
    <h2>Settings <span class="meta">(apply to all projects)</span></h2>
    <label>Transcription provider</label>
    <select id="set-provider">
      ${["ollama","anthropic","hybrid","mock"].map(p =>
        `<option ${p === s.provider ? "selected" : ""}>${p}</option>`).join("")}
    </select>
    <label>Ollama server URL</label>
    <div class="row" style="flex-wrap:nowrap">
      <input id="set-ourl" value="${esc(s.ollama_url)}" style="margin-bottom:0">
      <button class="secondary" onclick="testOllama()">Test</button>
    </div>
    <div class="meta" id="ollama-status" style="margin:.3rem 0 .6rem"></div>
    <label>Ollama vision model</label>
    <input id="set-omodel" list="omodel-list" value="${esc(s.ollama_model)}">
    <datalist id="omodel-list"></datalist>
    <label>Anthropic model</label>
    <input id="set-amodel" value="${esc(s.anthropic_model)}">
    <label>Anthropic API key ${s.anthropic_api_key_set
      ? '<span class="badge ok">configured</span>' : "(needed for anthropic / hybrid)"}</label>
    <input id="set-akey" type="password"
           placeholder="${s.anthropic_api_key_set ? "leave blank to keep current key" : "sk-ant-…"}">
    <div class="meta" style="margin-bottom:.6rem">Stored in the projects folder's
      config.toml on this machine. Hybrid mode transcribes locally first and only
      sends low-confidence pages to Anthropic.</div>
    <button onclick="saveSettings()">Save settings</button>
    <span class="meta" id="settings-status" style="margin-left:.6rem"></span>
  </div>`;
  testOllama();
}

async function testOllama() {
  const st = $("ollama-status");
  st.textContent = "checking Ollama server…";
  const r = await api("/settings/ollama-models?url=" +
                      encodeURIComponent($("set-ourl").value));
  if (r.ok) {
    st.textContent = `✓ connected — ${r.models.length} models available`;
    $("omodel-list").innerHTML = r.models.map(m => `<option value="${m}">`).join("");
  } else {
    st.textContent = "✗ can't reach server: " + r.error;
  }
}

async function saveSettings() {
  await api("/settings", {method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      provider: $("set-provider").value,
      ollama_url: $("set-ourl").value,
      ollama_model: $("set-omodel").value,
      anthropic_model: $("set-amodel").value,
      anthropic_api_key: $("set-akey").value,
    })});
  $("settings-status").textContent = "saved ✓";
  setTimeout(() => $("settings-status").textContent = "", 2500);
}

let vrows = 0;
function addVideoRow() {
  const d = document.createElement("div");
  d.className = "vrow";
  d.innerHTML = `
    <label>Video (upload or server path)</label>
    <input type="file" accept="video/*" class="np-vfile" onchange="uploadVideo(this)">
    <input class="np-vpath" placeholder="…or path, e.g. /data/flip1.mov">`;
  $("np-videos").appendChild(d);
  vrows++;
}

function uploadXHR(url, fd, onProgress) {
  // fetch() has no upload progress; phone videos are GB-scale, so show one
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.upload.onprogress = e => {
      if (e.lengthComputable && onProgress)
        onProgress(Math.round(100 * e.loaded / e.total));
    };
    x.onload = () => x.status < 300
      ? resolve(JSON.parse(x.responseText))
      : reject(new Error(x.responseText || x.statusText));
    x.onerror = () => reject(new Error("network error during upload"));
    x.send(fd);
  });
}

async function uploadVideo(input) {
  if (!input.files.length) return;
  const pathBox = input.parentElement.querySelector(".np-vpath");
  pathBox.disabled = true;
  const fd = new FormData();
  fd.append("file", input.files[0]);
  try {
    const r = await uploadXHR("/api/upload", fd,
                              pct => pathBox.value = `uploading… ${pct}%`);
    pathBox.value = r.path;
  } catch (e) { pathBox.value = ""; alert(e.message); }
  pathBox.disabled = false;
}

async function createProject() {
  const videos = [...document.querySelectorAll("#np-videos .vrow")].map(r => ({
    path: r.querySelector(".np-vpath").value,
  })).filter(v => v.path);
  try {
    await api("/projects", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        name: $("np-name").value, title: $("np-title").value || null,
        expected_pages: $("np-pages").value ? +$("np-pages").value : null,
        videos })});
    await refreshProjects();
    openProject($("np-name").value);
  } catch (e) { alert(e.message); }
}

async function openProject(name, tab) {
  current = name;
  const p = await api("/projects/" + name);
  window._proj = p;
  const stages = Object.entries(p.stages).map(([s, st]) =>
    `<span class="stage ${st}" id="stage-${s}">${s}</span>`).join("");
  $("main").innerHTML = `
  <div class="card">
    <h2>${esc(p.book.title || name)}</h2>
    <div class="stages">${stages}</div>
    <div class="row">
      <button id="runbtn" onclick="runPipeline()" ${p.running ? "disabled" : ""}>
        ${p.running ? "Running…" : "Run / Resume"}</button>
      <select id="provider" style="width:auto">
        <option value="">provider: config default</option>
        <option>ollama</option><option>anthropic</option><option>hybrid</option><option>mock</option>
      </select>
      <span class="meta">${p.videos.length} videos · ${p.pages.length} pages ·
        ${p.pages.filter(x => x.status === "suspect").length} suspect</span>
    </div>
    <div id="progress">
      <div class="ptrack"><div class="pfill" id="pfill"></div></div>
      <div class="plabel"><span id="ptext"></span><span id="peta"></span></div>
    </div>
    <div id="log"></div>
  </div>
  <div class="tabs">
    ${["pipeline","media","frames","pages","figures","output"].map(t =>
      `<div class="tab ${t === (tab||"pipeline") ? "active" : ""}"
        onclick="openProject('${name}','${t}')">${t}</div>`).join("")}
  </div>
  <div id="tabbody"></div>`;
  if (p.running) attachEvents(name);
  startProgress(name);
  renderTab(tab || "pipeline", p);
}

function wizardCardHtml(items, anyPages) {
  // honest breakdown of what the wizard will actually walk
  const n = (k) => (items || []).filter(i => i.kind === k).length;
  const parts = [];
  if (n("missing")) parts.push(`${n("missing")} never-captured page${n("missing") > 1 ? "s" : ""}`);
  if (n("reshoot")) parts.push(`${n("reshoot")} weak capture${n("reshoot") > 1 ? "s" : ""} worth re-shooting`);
  if (n("figure")) parts.push(`${n("figure")} figure close-up${n("figure") > 1 ? "s" : ""}`);
  const desc = !anyPages
    ? "no pages yet — photograph the whole book page by page (it asks for the last page number)"
    : parts.length
    ? `${parts.join(" + ")} — walk through them in page order; transcription runs once at the end`
    : "book looks complete — the wizard has nothing queued";
  return `
    <div class="card" style="background:#f0fdfa;border:2px solid var(--accent)">
      <div class="row">
        <div style="flex:1;min-width:14rem">
          <h2 style="margin-bottom:.2rem">📷 Capture wizard</h2>
          <div class="meta">${desc}</div>
        </div>
        <span class="row">
          <button style="font-size:1.05rem;padding:.7rem 1.4rem"
                  onclick="startWizard()">${!anyPages ? "Photograph the book"
                                            : "Capture by page number"}</button>
          ${anyPages ? `<button class="secondary" onclick="startUnidentifiedWizard()">
            Unidentified pages…</button>` : ""}
        </span>
      </div>
    </div>`;
}

function addPagePanel() {
  return `
    <div class="card">
      <h2>Add page from photo</h2>
      <div class="row">
        <input type="file" accept="image/*" id="addpage-file" style="width:auto">
        <select id="addpage-pos" style="width:auto">
          <option value="start">at the front (cover / inside cover)</option>
          <option value="end">at the back (back cover)</option>
        </select>
        <label style="display:flex;align-items:center;gap:.3rem">
          <input type="checkbox" id="addpage-cover" style="width:auto;margin:0">
          use as book cover image</label>
        <button onclick="addPagePhoto()">Add page</button>
      </div>
      <div class="meta">Covers become the EPUB cover image; other photos
      (inside-cover text, missed pages) are transcribed like normal pages.
      Photos of badly-captured pages: use the Patch button on that page instead.</div>
    </div>`;
}

function renderTab(tab, p) {
  const name = p.name, body = $("tabbody");
  if (tab === "pipeline") {
    Promise.all([api("/projects/" + name + "/reshoot"),
                 api(`/projects/${name}/capture-queue`)]).then(([r, q]) => {
      const items = r.items || [];
      const anyPages = (p.pages || []).some(x => !x.role);
      const wizardCard = wizardCardHtml(q.items, anyPages);
      const missingCard = r.missing && r.missing.length ? `
        <div class="card" style="border:2px solid #f59e0b">
          <h2>Missing pages — never captured</h2>
          <p>Printed pages <b>${esc(r.missing_ranges)}</b> (${r.missing.length} pages)
          appear in no video. Film those parts of the book (any direction) and use
          <b>+ Add video</b>, or photograph them with the capture wizard above.</p>
        </div>` : "";
      body.innerHTML = wizardCard + missingCard
        + `<div class="card"><h2>Reshoot list — captured badly</h2>` + (items.length
        ? "<ul>" + items.map(i =>
            `<li><a href="javascript:void(0)" onclick="gotoPage('${i.id}')"><b>${i.id}</b>${
              i.printed_number ? ` (printed ${i.printed_number})` : ""}</a>
             — ${esc(i.reasons.join(", "))}</li>`).join("") + "</ul>"
        : "<div class='meta'>empty — all pages look good</div>") + `</div>`;
    });
  } else if (tab === "media") {
    const photoPages = p.pages.filter(pg => pg.patched_source);
    api(`/projects/${name}/capture-queue`).then(q => {
      const holder = $("media-wizard");
      if (holder) holder.innerHTML = wizardCardHtml(
        q.items, (p.pages || []).some(x => !x.role));
    });
    body.innerHTML = `<div id="media-wizard"></div>` + `
      <div class="card">
        <h2>Add media</h2>
        <div class="row" style="margin-bottom:.6rem">
          <input type="file" accept="video/*" id="addvideo-file" style="display:none"
                 onchange="addVideoToProject()">
          <button onclick="$('addvideo-file').click()"
                  ${p.running ? "disabled" : ""}>+ Add video</button>
          <span class="meta">flip-through capture — shared pages merge, new pages
            slot in; run the pipeline after adding</span>
        </div>
      </div>
      ${addPagePanel()}
      <div class="card">
        <h2>Videos (${p.videos.length})</h2>
        ${p.videos.map(v => `
          <div class="row" style="border-top:1px solid var(--line);padding:.6rem 0">
            <div style="flex:1;min-width:12rem">
              <b>${v.id}</b> <span class="meta">·
                ${esc((v.source || v.path).split(/[\\\\/]/).pop())}</span>
              <div class="meta">${v.fps_actual} fps · ${v.nb_frames ?? "?"} frames ·
                ${v.duration ? Math.round(v.duration) + "s" : ""}
                ${v.rotate === 180 ? " · rotated 180°" : ""}</div>
            </div>
            <label style="display:flex;align-items:center;gap:.3rem">
              <input type="checkbox" style="width:auto;margin:0"
                     ${v.rotate === 180 ? "checked" : ""}
                     onchange="setRotate('${v.id}', this.checked)">
              shot upside-down</label>
          </div>`).join("") || "<div class='meta'>no videos yet</div>"}
      </div>
      <div class="card">
        <h2>Page photos (${photoPages.length})</h2>
        ${photoPages.map(pg => `
          <div class="row" style="border-top:1px solid var(--line);padding:.6rem 0">
            <img src="/api/projects/${name}/file/${pg.patched_source}?t=${Date.now()}"
                 style="height:90px;border:1px solid var(--line);border-radius:4px">
            <div style="flex:1;min-width:10rem">
              <a href="javascript:void(0)" onclick="gotoPage('${pg.id}')"><b>${pg.id}</b></a>
              <span class="badge ${pg.status}">${pg.status === "deleted" ? "hidden" : pg.status}</span>
              ${pg.role === "cover" ? '<span class="badge ok">cover</span>' : ""}
              <div class="meta">${pg.printed_number != null
                ? "printed " + pg.printed_number : "no page number"}</div>
            </div>
          </div>`).join("")
          || "<div class='meta'>no photos added yet — use 'Add page from photo' above " +
             "for covers, inside-cover text, or missed pages</div>"}
      </div>`;
  } else if (tab === "pages") {
    // inline gap markers: two sequential known pages that aren't consecutive
    // mean the pages between them were never captured
    let lastNum = null;
    const gapBefore = (pg) => {
      if (pg.status === "duplicate" || pg.status === "deleted" || pg.role) return "";
      const n = pg.printed_number;
      if (n == null || n < 1) return "";
      let out = "";
      if (lastNum != null && n > lastNum + 1) {
        const a = lastNum + 1, b = n - 1;
        out = `<div class="card" style="border:2px dashed #f59e0b;background:#fffbeb;
                 padding:.5rem 1.5rem;display:flex;gap:.8rem;align-items:center">
          <span style="color:#b45309"><b>missing:</b>
            page${b > a ? "s " + a + "–" + b : " " + a} — never captured</span>
          <span class="meta" style="margin:0 0 0 auto">film this part of the book and
            add the video, or add a photo (Media tab)</span>
        </div>`;
      }
      lastNum = n;
      return out;
    };
    body.innerHTML = p.pages.map(pg => gapBefore(pg) + (pg2html(pg))).join("")
      + cropModalHtml();
    function pg2html(pg) {
      const collapsed = pg.status === "deleted" || pg.status === "duplicate";
      const numLabel = pg.printed_number != null
        ? "printed " + pg.printed_number + (pg.number_inferred ? " (inferred)" : "")
          + (pg.number_manual ? " (manual)" : "")
        : "no page number";
      // row 1: identity + page-number reassignment
      const header = `
        <div class="row" style="padding:.15rem 0">
          <span class="badge ${pg.status}">${pg.status === "deleted" ? "hidden" : pg.status}</span>
          <b>${pg.id}</b>
          <span class="meta" style="margin:0">${numLabel}
            ${pg.confidence ? " · " + pg.confidence : ""}
            ${pg.needs_reshoot ? " · 📷 re-acquire" : ""}
            ${pg.reasons?.length
              ? ` · <span style="color:#b45309">⚠ ${esc(pg.reasons.join("; "))}</span>`
                + (pg.status === "suspect"
                  ? ` <button class="secondary" style="padding:.1rem .5rem;font-size:.7rem"
                       title="page is actually fine — clear the suspect flag"
                       onclick="ignoreSuspect('${pg.id}')">ignore</button>` : "") : ""}</span>
          <span class="row" style="margin-left:auto">
            ${collapsed ? `
              ${pg.status === "duplicate" ? `<button class="secondary"
                 onclick="unduplicate('${pg.id}')">Not a duplicate</button>` : ""}
              ${pg.status === "deleted" ? `<button class="secondary"
                 onclick="restorePage('${pg.id}')">Unhide</button>` : ""}
              <button class="secondary" onclick="toggleCell('${pg.id}')"
                      id="tgl-${pg.id}">expand ▾</button>`
            : `<label style="margin:0">page #</label>
               <input type="number" id="num-${pg.id}" value="${pg.printed_number ?? ""}"
                      title="0 or negative = front matter (sorts before page 1): title -3, TOC -2, foreword -1"
                      style="width:5.5rem;margin:0" onchange="setPageNumber('${pg.id}')">`}
          </span>
        </div>`;
      const figs = (pg.figures || []).map((f, i) => `
        <span style="display:inline-flex;flex-direction:column;align-items:center;
                     gap:2px;vertical-align:top">
          <img src="/api/projects/${name}/file/${f}?t=${Date.now()}"
               style="height:90px;border:1px solid var(--line);border-radius:4px;
                      cursor:crosshair"
               title="click to re-crop" onclick="openCrop('${pg.id}', ${i}, 'pages')">
          <span style="display:flex;gap:2px">
            <button class="secondary" style="padding:.15rem .5rem;font-size:.7rem"
                    onclick="openCrop('${pg.id}', ${i}, 'pages')">re-crop</button>
            <button class="secondary" style="padding:.15rem .5rem;font-size:.7rem"
                    title="mark for close-up re-shoot"
                    onclick="figReacq('${pg.id}', ${i})">re-acq</button>
          </span>
        </span>`).join("")
        // regions whose figure crop never happened: offer to draw one
        + (pg.regions || []).map((r, ri) => {
            const expected = `figures/${pg.id}_${String.fromCharCode(97 + ri % 26)}.png`;
            return (!r.deleted && !(pg.figures || []).includes(expected)) ? `
              <button class="secondary" style="border:2px dashed #f59e0b;background:#fffbeb;
                      color:#b45309"
                      onclick="openCrop('${pg.id}', ${ri}, 'pages', true)">
                + add figure for region ${ri}${r.caption ? " · " + esc(r.caption).slice(0, 30) : ""}
              </button>` : "";
          }).join("");
      return `
      <div class="card ${pg.status}" id="cell-${pg.id}">
        ${header}
        <div class="pagerow-body" style="${collapsed ? "display:none" : ""}">
          <div class="pagegrid">
            <div>
              ${pg.color ? `<img loading="lazy" style="width:100%;border:1px solid
                 var(--line);border-radius:4px"
                 src="/api/projects/${name}/file/${pg.color}?t=${Date.now()}">` : ""}

            <div>
              <textarea id="md-${pg.id}" data-page="${pg.id}"></textarea>
              <button style="margin-top:.4rem" onclick="saveMd('${pg.id}')">Save markdown</button>
            </div>
          </div>
          <div class="row" style="border-top:1px solid var(--line);margin-top:.8rem;
               padding-top:.7rem">
            <input type="file" id="patch-${pg.id}" style="display:none"
                   onchange="patchPage('${pg.id}')">
            <button class="secondary" onclick="$('patch-${pg.id}').click()">
              Replace photo &amp; re-process…</button>
            <button class="secondary" onclick="toggleReshoot('${pg.id}', ${!pg.needs_reshoot})">
              ${pg.needs_reshoot ? "Unmark re-acquire" : "Mark for re-acquisition"}</button>
            ${pg.status === "duplicate"
              ? `<button class="secondary" onclick="unduplicate('${pg.id}')">Not a duplicate</button>`
              : `<button class="secondary" onclick="markDuplicate('${pg.id}')">Mark as duplicate</button>`}
            ${pg.status === "deleted"
              ? `<button class="secondary" onclick="restorePage('${pg.id}')">Unhide</button>`
              : `<button class="danger" onclick="deletePage('${pg.id}')">Hide</button>`}
          </div>
        </div>
      </div>`;
    }
    p.pages.forEach(async pg => {
      if (pg.md) {
        const r = await fetch(`/api/projects/${name}/file/${pg.md}`);
        if (r.ok) $("md-" + pg.id).value = await r.text();
      }
    });
  } else if (tab === "frames") {
    body.innerHTML = `<div class="card"><h2>Canonical frames (contact sheet)</h2>
      ${p.contact_sheet
        ? `<img style="max-width:100%" src="/api/projects/${name}/file/work/contact_sheet.jpg">`
        : "<div class='meta'>run the pipeline first</div>"}</div>`;
  } else if (tab === "figures") {
    // chronological rows (book order), grouped by printed page number so
    // duplicate captures of the same figure sit together
    const rows = [];
    p.pages.forEach(pg => {
      if (pg.status === "duplicate" || pg.status === "deleted") return;
      (pg.figures || []).forEach((f, i) => {
        const letter = f.split("_").pop().split(".")[0];
        const ridx = letter.charCodeAt(0) - 97;
        rows.push({pg, f, i, caption: (pg.regions?.[ridx]?.caption) || ""});
      });
    });
    const groups = [];
    rows.forEach(r => {
      const last = groups[groups.length - 1];
      const num = r.pg.printed_number;
      if (last && num != null && last.num === num) last.rows.push(r);
      else groups.push({num, rows: [r]});
    });
    const figRow = (r) => `
      <div class="row" style="border-top:1px solid var(--line);padding:.7rem 0">
        <a href="javascript:void(0)" onclick="openCrop('${r.pg.id}', ${r.i})"
           title="click to re-crop">
          <img src="/api/projects/${name}/file/${r.f}?t=${Date.now()}"
               style="height:130px;border:1px solid var(--line);border-radius:4px;
                      cursor:crosshair"></a>
        <div style="flex:1;min-width:12rem">
          <div><a href="javascript:void(0)" onclick="gotoPage('${r.pg.id}')">
            <b>${r.pg.printed_number != null ? "page " + r.pg.printed_number
                : "unnumbered"}</b> <span class="meta">· ${r.pg.id}</span></a></div>
          ${r.caption ? `<div class="meta">${esc(r.caption)}</div>` : ""}
        </div>
        <span class="row">
          <button class="secondary" onclick="openCrop('${r.pg.id}', ${r.i})">Re-crop</button>
          <input type="file" accept="image/*" id="figup-${r.pg.id}-${r.i}"
                 style="display:none" onchange="uploadFigure('${r.pg.id}', ${r.i})">
          <button class="secondary"
                  onclick="$('figup-${r.pg.id}-${r.i}').click()">Re-upload</button>
          <button class="secondary"
                  onclick="figReacq('${r.pg.id}', ${r.i})">Re-acquire</button>
          <button class="danger" onclick="delFigure('${r.pg.id}', ${r.i})">Delete</button>
        </span>
      </div>`;
    body.innerHTML = `<div class="card"><h2>Figures <span class="meta">
      (book order — re-crop, replace, or delete; duplicate groups can keep the
      sharpest automatically)</span></h2>
      <div class="row" style="margin-bottom:.6rem">
        <button class="secondary" onclick="autoRefine()">✨ Auto-refine crops
          (edge detection)</button>
        <span class="meta">snaps every non-hand-cropped figure to the actual
          photo boundaries</span>
      </div>` +
      (groups.map(g => g.rows.length > 1 ? `
        <div style="border:2px solid #f59e0b;border-radius:8px;padding:.2rem .8rem;
             margin:.6rem 0">
          <div class="row" style="padding:.4rem 0">
            <span class="meta">⚠ ${g.rows.length} figures on printed page ${g.num}
              — duplicates?</span>
            <button class="secondary" onclick='keepBest(${JSON.stringify(
              g.rows.map(r => ({page_id: r.pg.id, fig_idx: r.i})))})'>
              Keep sharpest, delete rest</button>
          </div>
          ${g.rows.map(figRow).join("")}
        </div>` : g.rows.map(figRow).join("")).join("")
       || "<div class='meta'>no figures yet</div>") + `</div>` + cropModalHtml();
  } else if (tab === "output") {
    body.innerHTML = `<div class="card"><h2>Build</h2>
      <div class="row" style="margin-bottom:.6rem">
        <label style="margin:0">Target device</label>
        <select id="build-device" style="width:auto">
          ${["none","xteink-x3","xteink-x4","eink-6in","tablet"].map(d =>
            `<option>${d}</option>`).join("")}
        </select>
        <span class="meta">images resized/grayscaled for small e-ink readers</span>
      </div>
      <div class="row">
        ${["epub","pdf-facsimile","pdf"].map(f =>
          `<button onclick="buildFmt('${f}')">Build ${f}</button>`).join("")}
      </div>
      <h2 style="margin-top:1rem">Downloads</h2>
      <ul>${p.outputs.map(f =>
        `<li><a href="/api/projects/${name}/file/out/${f}">${f}</a></li>`).join("")
        || "<div class='meta'>nothing built yet</div>"}</ul></div>`;
  }
}

async function runPipeline() {
  const prov = $("provider").value;
  await api(`/projects/${current}/run` + (prov ? `?provider=${prov}` : ""), {method:"POST"});
  $("runbtn").disabled = true; $("runbtn").textContent = "Running…";
  attachEvents(current);
  startProgress(current);
}

let progressTimer = null;
function startProgress(name) {
  clearInterval(progressTimer);
  const tick = async () => {
    let p;
    try { p = await api(`/projects/${name}/progress`); } catch { return; }
    if (name !== current) { clearInterval(progressTimer); return; }
    const chip = $("global-status");
    if (chip) {
      if (p.running) {
        chip.style.display = "block";
        chip.textContent = p.detail && p.detail.total
          ? `⚙ ${p.current} ${Math.round(100 * p.detail.done / p.detail.total)}%`
            + (p.eta_seconds > 90 ? ` · ~${Math.round(p.eta_seconds / 60)} min`
               : p.eta_seconds != null ? ` · ~${p.eta_seconds}s` : "")
          : `⚙ ${p.current || "running"}…`;
      } else {
        chip.style.display = "none";
      }
    }
    const rb = $("runbtn");
    if (rb) {
      rb.disabled = p.running;
      rb.textContent = p.running ? "Running…" : "Run / Resume";
    }
    // live stage chips
    for (const [s, st] of Object.entries(p.stages)) {
      const el = $("stage-" + s);
      if (el) el.className = "stage " + st + (s === p.current && p.running ? " active" : "");
    }
    const box = $("progress");
    if (!box) return;
    if (p.running && p.detail && p.detail.total) {
      box.style.display = "block";
      const pct = Math.round(100 * p.detail.done / p.detail.total);
      $("pfill").style.width = pct + "%";
      $("ptext").textContent =
        `${p.current}: ${p.detail.done} / ${p.detail.total} ${p.detail.unit} (${pct}%)`;
      $("peta").textContent = p.eta_seconds == null ? "" :
        p.eta_seconds > 90 ? `~${Math.round(p.eta_seconds / 60)} min left`
                           : `~${p.eta_seconds}s left`;
    } else if (p.running) {
      box.style.display = "block";
      $("pfill").style.width = "100%";
      $("ptext").textContent = p.current ? `${p.current}: working…` : "starting…";
      $("peta").textContent = "";
    } else {
      box.style.display = "none";  // keep polling: a run may start elsewhere
    }
  };
  tick();
  progressTimer = setInterval(tick, 4000);
}

let logStream = null;   // only ever one open log stream
function attachEvents(name) {
  const log = $("log");
  log.style.display = "block";
  if (logStream) logStream.close();   // re-visiting the tab must not stack streams
  const es = logStream = new EventSource(`/api/projects/${name}/events`);
  es.onmessage = (e) => {
    log.textContent += JSON.parse(e.data) + "\n";
    log.scrollTop = log.scrollHeight;
  };
  es.addEventListener("done", () => { es.close(); openProject(name); refreshProjects(); });
  es.onerror = () => es.close();
}

// ---- capture wizards: numbered pages in order, and unidentified captures
let wiz = null;
async function startWizard() {
  const q = await api(`/projects/${current}/capture-queue`);
  let items = q.items;
  if (!items.length) {
    const anyPages = (window._proj?.pages || []).some(x => !x.role);
    if (!anyPages) {
      const last = parseInt(prompt(
        "Photograph the whole book!\nWhat is the last printed page number?") || "");
      if (!last || last < 1) return;
      items = Array.from({length: last}, (_, i) => ({
        kind: "missing", number: i + 1, label: `page ${i + 1}`,
        reasons: ["photograph every page in order"]}));
    } else {
      alert("Nothing to capture — the book looks complete!");
      return;
    }
  }
  wiz = {items, i: 0, done: 0, mode: "numbered"};
  renderWizard();
}

function startUnidentifiedWizard() {
  const items = (window._proj.pages || [])
    .filter(pg => !pg.role && !["duplicate", "deleted", "patched"].includes(pg.status)
                  && (pg.printed_number == null || pg.printed_number < 1)
                  && (pg.reasons || []).length)
    .map(pg => ({kind: "reshoot", page_id: pg.id, color: pg.color,
                 label: pg.id, reasons: pg.reasons}));
  if (!items.length) { alert("No unidentified problem pages — nice."); return; }
  wiz = {items, i: 0, done: 0, mode: "unidentified"};
  renderWizard();
}

function renderWizard() {
  const it = wiz.items[wiz.i];
  if (!it) { return finishWizard(); }
  const preview = wiz.mode === "unidentified" ? it.color : it.preview;
  const img = preview ? `
    <img src="/api/projects/${current}/file/${preview}?t=${Date.now()}"
         style="max-height:45vh;border:1px solid var(--line);border-radius:6px;
                margin-bottom:1rem">` : "";
  const title = wiz.mode === "unidentified"
    ? "Find this page in the book" : `📖 ${esc(it.label)}`;
  $("main").innerHTML = `
  <div class="card" style="max-width:34rem;margin:0 auto;text-align:center">
    <div class="meta">${wiz.mode === "unidentified" ? "unidentified pages" : "capture"}
      wizard · ${wiz.i + 1} of ${wiz.items.length} · ${wiz.done} handled</div>
    <h2 style="font-size:${wiz.mode === "unidentified" ? "1.4" : "2.2"}rem;
        margin:.6rem 0">${title}</h2>
    <div class="meta" style="margin-bottom:1rem">${esc(it.reasons.join(", "))}</div>
    <div class="ptrack" style="margin-bottom:1.2rem"><div class="pfill"
         style="width:${Math.round(100 * wiz.i / wiz.items.length)}%"></div></div>
    ${img}
    <input type="file" accept="image/*" capture="environment" id="wiz-file"
           style="display:none" onchange="wizardShot()">
    <button style="font-size:1.3rem;padding:1rem 2.2rem;width:100%"
            onclick="$('wiz-file').click()" id="wiz-btn">📷 Take photo</button>
    <div class="row" style="margin-top:1rem;justify-content:center">
      ${wiz.mode === "unidentified" ? `<button class="danger"
         onclick="wizardHide()">Junk — hide it</button>` : ""}
      <button class="secondary" onclick="wiz.i++; renderWizard()">Skip</button>
      <button class="secondary" onclick="finishWizard()">Finish</button>
    </div>
    <div class="meta" style="margin-top:1rem">${wiz.mode === "unidentified"
      ? "Use the capture above to locate the page, then photograph it flat — or " +
        "hide it if it's not really a page (mid-turn shot, desk, etc.)."
      : "Lay the book flat, fill the frame with the page, keep the printed page " +
        "number visible. Photos queue up — transcription happens in one go when " +
        "you finish."}</div>
  </div>`;
}

async function wizardHide() {
  const it = wiz.items[wiz.i];
  try { await api(`/projects/${current}/pages/${it.page_id}`, {method:"DELETE"}); }
  catch (e) { alert("hide failed: " + e.message); return; }
  wiz.done++;
  wiz.i++;
  renderWizard();
}

async function wizardShot() {
  const input = $("wiz-file");
  if (!input.files.length) return;
  const it = wiz.items[wiz.i];
  const btn = $("wiz-btn");
  btn.disabled = true;
  const fd = new FormData();
  fd.append("photo", input.files[0]);
  const params = it.kind === "missing"
    ? `kind=missing&number=${it.number}`
    : it.kind === "figure"
    ? `kind=figure&page_id=${it.page_id}&fig_idx=${it.fig_idx}`
    : `kind=reshoot&page_id=${it.page_id}`
      + (it.number != null ? `&number=${it.number}` : "");
  try {
    await uploadXHR(`/api/projects/${current}/capture?${params}`, fd,
                    pct => btn.textContent = `uploading ${pct}%`);
    wiz.done++;
    wiz.i++;
    renderWizard();
  } catch (e) {
    alert("capture failed: " + e.message);
    btn.disabled = false;
    btn.textContent = "📷 Take photo";
  }
}

async function finishWizard() {
  const done = wiz?.done || 0;
  wiz = null;
  if (done && confirm(`${done} pages captured. Run the pipeline now to transcribe them?`)) {
    await api(`/projects/${current}/run`, {method:"POST"});
  }
  openProject(current);
}

async function gotoPage(pageId) {
  await openProject(current, "pages");
  const el = document.getElementById("cell-" + pageId);
  if (!el) return;
  el.style.outline = "3px solid var(--accent)";
  setTimeout(() => el.style.outline = "", 3000);
  // images above the cell finish loading after we jump and push it away —
  // keep re-pinning until layout settles or the user takes over scrolling
  const main = $("main");
  let userScrolled = false;
  const takeOver = () => userScrolled = true;
  main.addEventListener("wheel", takeOver, {passive: true});
  main.addEventListener("touchmove", takeOver, {passive: true});
  el.scrollIntoView({block: "start"});
  const t0 = performance.now();
  (function pin() {
    if (userScrolled || performance.now() - t0 > 2500) {
      main.removeEventListener("wheel", takeOver);
      main.removeEventListener("touchmove", takeOver);
      return;
    }
    const drift = el.getBoundingClientRect().top - main.getBoundingClientRect().top;
    if (Math.abs(drift) > 2) el.scrollIntoView({block: "start"});
    requestAnimationFrame(pin);
  })();
}

// ---- figure crop editor: draw a rectangle over the page image
function cropModalHtml() {
  return `
  <div id="crop-modal" style="display:none;position:fixed;inset:0;z-index:50;
       background:rgba(0,0,0,.7);align-items:center;justify-content:center">
    <div style="background:#fff;border-radius:10px;padding:1rem;max-width:92vw;
         max-height:92vh;overflow:auto">
      <div class="row" style="margin-bottom:.5rem">
        <b>Re-crop figure</b>
        <span class="meta">drag to draw a box, then drag corners to fine-tune —
          skewed shapes are straightened back to a rectangle</span>
        <button class="secondary" style="margin-left:auto"
                onclick="magicCrop()">✨ Magic crop</button>
        <button onclick="saveCrop()">Save crop</button>
        <button class="secondary" onclick="$('crop-modal').style.display='none'">Cancel</button>
      </div>
      <div id="crop-stage" style="position:relative;touch-action:none;cursor:crosshair;
           display:inline-block">
        <img id="crop-img" style="max-width:86vw;max-height:75vh;display:block;
             user-select:none;-webkit-user-drag:none" draggable="false">
        <svg id="crop-svg" style="position:absolute;inset:0;width:100%;height:100%">
          <polygon id="crop-poly" fill="rgba(13,148,136,.15)" stroke="#0d9488"
                   stroke-width="2" points=""/>
          ${[0,1,2,3].map(i => `<circle id="crop-h${i}" r="9" fill="#0d9488"
              stroke="#fff" stroke-width="2" style="display:none"/>`).join("")}
        </svg>
        <div id="crop-loupe" style="display:none;position:absolute;width:140px;
             height:140px;border:3px solid #0d9488;border-radius:50%;
             background-repeat:no-repeat;pointer-events:none;z-index:5;
             box-shadow:0 2px 12px rgba(0,0,0,.4)">
          <div style="position:absolute;left:50%;top:50%;width:14px;height:14px;
               margin:-7px 0 0 -7px;border:2px solid #dc2626;border-radius:50%"></div>
        </div>
      </div>
    </div>
  </div>`;
}

let cropCtx = null;
function openCrop(pageId, figIdx, origin = "figures", isRegion = false) {
  const pg = window._proj.pages.find(p => p.id === pageId);
  // corners ordered tl,tr,br,bl (normalized); start from the existing region
  const bb = pg.regions?.[figIdx]?.bbox_norm;
  cropCtx = {pageId, figIdx, origin, isRegion, mode: null, corner: -1,
             quad: bb ? [[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]] : null};
  const img = $("crop-img");
  img.src = `/api/projects/${current}/file/${pg.color}?t=${Date.now()}`;
  $("crop-modal").style.display = "flex";
  img.onload = () => drawCropQuad();
  const stage = $("crop-stage");
  const norm = (e) => {
    const r = img.getBoundingClientRect();
    return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
            Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))];
  };
  stage.onpointerdown = (e) => {
    const [x, y] = norm(e);
    stage.setPointerCapture(e.pointerId);
    // grab a corner if close to one (finger-sized threshold)
    if (cropCtx.quad) {
      const r = img.getBoundingClientRect();
      const near = cropCtx.quad.findIndex(c =>
        Math.hypot((c[0]-x) * r.width, (c[1]-y) * r.height) < 22);
      if (near >= 0) { cropCtx.mode = "corner"; cropCtx.corner = near; return; }
    }
    cropCtx.mode = "draw";
    cropCtx.start = [x, y];
    cropCtx.quad = [[x,y],[x,y],[x,y],[x,y]];
    drawCropQuad();
  };
  stage.onpointermove = (e) => {
    if (!cropCtx.mode) return;
    const [x, y] = norm(e);
    if (cropCtx.mode === "draw") {
      const [sx, sy] = cropCtx.start;
      const x0 = Math.min(sx,x), y0 = Math.min(sy,y),
            x1 = Math.max(sx,x), y1 = Math.max(sy,y);
      cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    } else {
      cropCtx.quad[cropCtx.corner] = [x, y];
    }
    drawCropQuad();
    showLoupe(x, y);
  };
  stage.onpointerup = () => {
    cropCtx.mode = null; cropCtx.corner = -1;
    $("crop-loupe").style.display = "none";
  };
}

function showLoupe(nx, ny) {
  // 3x magnifier centered on the drag point, offset so the finger doesn't hide it
  const img = $("crop-img"), loupe = $("crop-loupe");
  const Z = 3, L = 140;
  const w = img.clientWidth, h = img.clientHeight;
  loupe.style.display = "block";
  loupe.style.backgroundImage = `url("${img.src}")`;
  loupe.style.backgroundSize = `${w * Z}px ${h * Z}px`;
  loupe.style.backgroundPosition =
    `${-(nx * w * Z - L / 2)}px ${-(ny * h * Z - L / 2)}px`;
  const lx = Math.max(0, Math.min(w - L, nx * w - L / 2));
  const above = ny * h - L - 24;
  loupe.style.left = lx + "px";
  loupe.style.top = (above > 0 ? above : ny * h + 24) + "px";
}

function drawCropQuad() {
  const img = $("crop-img"), poly = $("crop-poly");
  const w = img.clientWidth, h = img.clientHeight;
  if (!cropCtx?.quad) {
    poly.setAttribute("points", "");
    [0,1,2,3].forEach(i => $("crop-h"+i).style.display = "none");
    return;
  }
  poly.setAttribute("points",
    cropCtx.quad.map(c => `${c[0]*w},${c[1]*h}`).join(" "));
  cropCtx.quad.forEach((c, i) => {
    const hd = $("crop-h"+i);
    hd.style.display = "block";
    hd.setAttribute("cx", c[0]*w);
    hd.setAttribute("cy", c[1]*h);
  });
}

async function magicCrop() {
  try {
    const r = await api(`/projects/${current}/pages/${cropCtx.pageId}/magic-crop`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(cropCtx.quad ? {quad_norm: cropCtx.quad} : {})});
    if (!r.ok) { alert(r.detail || "no confident detection"); return; }
    const [x0, y0, x1, y1] = r.bbox_norm;
    cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    drawCropQuad();
  } catch (e) { alert("magic crop failed: " + e.message); }
}

async function saveCrop() {
  if (!cropCtx?.quad) { alert("draw a box first"); return; }
  try {
    await api(`/projects/${current}/pages/${cropCtx.pageId}/`
      + (cropCtx.isRegion ? `regions/${cropCtx.figIdx}/crop` : `figures/${cropCtx.figIdx}/crop`), {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({quad_norm: cropCtx.quad})});
  } catch (e) { alert("crop failed: " + e.message); return; }
  $("crop-modal").style.display = "none";
  if (cropCtx.origin === "pages") gotoPage(cropCtx.pageId);
  else openProject(current, "figures");
}

async function autoRefine() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = "refining…";
  try {
    const r = await api(`/projects/${current}/figures/auto-refine`, {method:"POST"});
    alert(`${r.refined} figure crops refined by edge detection.`);
  } catch (e) { alert("auto-refine failed: " + e.message); }
  openProject(current, "figures");
}

async function figReacq(pageId, figIdx) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}/reshoot`,
                  {method:"POST"});
  } catch (e) { alert("failed: " + e.message); return; }
  alert("Marked — it joins the capture wizard queue as a close-up shot.");
}

async function delFigure(pageId, figIdx) {
  if (!confirm("Delete this figure from the book?")) return;
  await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}`, {method:"DELETE"});
  openProject(current, "figures");
}

async function uploadFigure(pageId, figIdx) {
  const input = $(`figup-${pageId}-${figIdx}`);
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append("photo", input.files[0]);
  const r = await fetch(
    `/api/projects/${current}/pages/${pageId}/figures/${figIdx}/upload`,
    {method:"POST", body: fd});
  if (!r.ok) alert("upload failed");
  openProject(current, "figures");
}

async function keepBest(items) {
  if (!confirm(`Keep the sharpest of ${items.length} figures and delete the rest?`)) return;
  await api(`/projects/${current}/figures/keep-best`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({items})});
  openProject(current, "figures");
}

async function deletePage(pageId) {
  await api(`/projects/${current}/pages/${pageId}`, {method:"DELETE"});
  openProject(current, "pages");
}

async function restorePage(pageId) {
  await api(`/projects/${current}/pages/${pageId}/restore`, {method:"POST"});
  openProject(current, "pages");
}

refreshProjects();
