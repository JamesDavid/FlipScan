let cropCtx = null;
function openCrop(pageId, figIdx, origin = "figures", isRegion = false) {
  const pg = window._proj.pages.find(p => p.id === pageId);
  const reg = pg.regions?.[figIdx];
  // a re-acquired close-up is its OWN image — trim IT, not the full page,
  // so re-cropping can never destroy the close-up you took
  const own = !!(reg && reg.own_image);
  const figRel = (pg.figures || [])[figIdx];
  const bb = own ? null : reg?.bbox_norm;
  cropCtx = {pageId, figIdx, origin, isRegion, own, mode: null, corner: -1,
             quad: (!own && reg?.quad_norm && reg.quad_norm.length === 4)
               ? reg.quad_norm.map(p => [...p])
               : bb ? [[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]]
               : own ? [[0.02,0.02],[0.98,0.02],[0.98,0.98],[0.02,0.98]] : null};
  const img = $("crop-img");
  const src = (own && figRel) ? figRel : pg.color;
  img.src = `/api/projects/${current}/file/${src}?t=${Date.now()}`;
  $("crop-modal").style.display = "flex";
  img.onload = () => drawCropQuad();
  attachCropHandlers();
}

function attachCropHandlers() {
  const img = $("crop-img");
  const stage = $("crop-stage");
  const norm = (e) => {
    const r = img.getBoundingClientRect();
    return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
            Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))];
  };
  // each edge connects two corners: top 0-1, right 1-2, bottom 2-3, left 3-0
  const EDGES = [[0,1],[1,2],[2,3],[3,0]];
  stage.onpointerdown = (e) => {
    const [x, y] = norm(e);
    stage.setPointerCapture(e.pointerId);
    if (cropCtx.quad) {
      const r = img.getBoundingClientRect();
      const px = (c) => [(c[0]-x) * r.width, (c[1]-y) * r.height];
      // grab a corner first (finger-sized threshold)
      const near = cropCtx.quad.findIndex(c => Math.hypot(...px(c)) < 22);
      if (near >= 0) { cropCtx.mode = "corner"; cropCtx.corner = near; return; }
      // else grab an edge midpoint → translate the whole edge as a unit
      const ei = EDGES.findIndex(([a,b]) => {
        const m = [(cropCtx.quad[a][0]+cropCtx.quad[b][0])/2,
                   (cropCtx.quad[a][1]+cropCtx.quad[b][1])/2];
        return Math.hypot(...px(m)) < 22;
      });
      if (ei >= 0) {
        cropCtx.mode = "edge"; cropCtx.edge = ei;
        cropCtx.dragStart = [x, y];
        cropCtx.startQuad = cropCtx.quad.map(c => [...c]);
        return;
      }
    }
    cropCtx.mode = "draw";
    cropCtx.start = [x, y];
    cropCtx.quad = [[x,y],[x,y],[x,y],[x,y]];
    drawCropQuad();
  };
  stage.onpointermove = (e) => {
    if (!cropCtx.mode) return;
    const [x, y] = norm(e);
    if (cropCtx.mode === "draw") {
      const [sx, sy] = cropCtx.start;
      const x0 = Math.min(sx,x), y0 = Math.min(sy,y),
            x1 = Math.max(sx,x), y1 = Math.max(sy,y);
      cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    } else if (cropCtx.mode === "edge") {
      // move both endpoints of the edge by the same delta (translate the line)
      const dx = x - cropCtx.dragStart[0], dy = y - cropCtx.dragStart[1];
      const [a, b] = EDGES[cropCtx.edge];
      const clamp = (v) => Math.max(0, Math.min(1, v));
      for (const c of [a, b]) {
        cropCtx.quad[c][0] = clamp(cropCtx.startQuad[c][0] + dx);
        cropCtx.quad[c][1] = clamp(cropCtx.startQuad[c][1] + dy);
      }
    } else {
      cropCtx.quad[cropCtx.corner] = [x, y];
    }
    drawCropQuad();
    showLoupe(x, y);
  };
  stage.onpointerup = () => {
    cropCtx.mode = null; cropCtx.corner = -1; cropCtx.edge = -1;
    $("crop-loupe").style.display = "none";
  };
}

function showLoupe(nx, ny) {
  // 3x magnifier centered on the drag point, offset so the finger doesn't hide it
  const img = $("crop-img"), loupe = $("crop-loupe");
  const Z = 3, L = 140;
  const w = img.clientWidth, h = img.clientHeight;
  loupe.style.display = "block";
  loupe.style.backgroundImage = `url("${img.src}")`;
  loupe.style.backgroundSize = `${w * Z}px ${h * Z}px`;
  loupe.style.backgroundPosition =
    `${-(nx * w * Z - L / 2)}px ${-(ny * h * Z - L / 2)}px`;
  const lx = Math.max(0, Math.min(w - L, nx * w - L / 2));
  const above = ny * h - L - 24;
  loupe.style.left = lx + "px";
  loupe.style.top = (above > 0 ? above : ny * h + 24) + "px";
}

function drawCropQuad() {
  const img = $("crop-img"), poly = $("crop-poly");
  const w = img.clientWidth, h = img.clientHeight;
  if (!cropCtx?.quad) {
    poly.setAttribute("points", "");
    [0,1,2,3].forEach(i => {
      $("crop-h"+i).style.display = "none";
      $("crop-e"+i).style.display = "none";
    });
    return;
  }
  const q = cropCtx.quad;
  poly.setAttribute("points", q.map(c => `${c[0]*w},${c[1]*h}`).join(" "));
  q.forEach((c, i) => {
    const hd = $("crop-h"+i);
    hd.style.display = "block";
    hd.setAttribute("cx", c[0]*w);
    hd.setAttribute("cy", c[1]*h);
  });
  // edge-midpoint handles (square) — drag to move the whole edge
  [[0,1],[1,2],[2,3],[3,0]].forEach(([a,b], i) => {
    const mx = (q[a][0]+q[b][0])/2 * w, my = (q[a][1]+q[b][1])/2 * h;
    const e = $("crop-e"+i);
    e.style.display = "block";
    e.setAttribute("x", mx - 10);
    e.setAttribute("y", my - 10);
  });
}

async function magicCrop() {
  try {
    // first click fetches candidates; further clicks cycle through them
    if (!cropCtx.magic || !cropCtx.magic.length) {
      const r = await api(`/projects/${current}/pages/${cropCtx.pageId}/magic-crop`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(cropCtx.quad ? {quad_norm: cropCtx.quad} : {})});
      if (!r.ok) { alert(r.detail || "no confident detection"); return; }
      cropCtx.magic = r.candidates || [r.bbox_norm];
      cropCtx.magicI = 0;
    } else {
      cropCtx.magicI = (cropCtx.magicI + 1) % cropCtx.magic.length;
    }
    const [x0, y0, x1, y1] = cropCtx.magic[cropCtx.magicI];
    cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    drawCropQuad();
  } catch (e) { alert("magic crop failed: " + e.message); }
}

async function saveCrop() {
  if (!cropCtx?.quad) { alert("draw a box first"); return; }
  try {
    await api(`/projects/${current}/pages/${cropCtx.pageId}/`
      + (cropCtx.isPage ? "crop-page"
         : cropCtx.isRegion ? `regions/${cropCtx.figIdx}/crop`
         : `figures/${cropCtx.figIdx}/crop`), {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({quad_norm: cropCtx.quad})});
  } catch (e) { alert("crop failed: " + e.message); return; }
  if (!cropCtx.isPage)
    bumpFig(`figures/${cropCtx.pageId}_${String.fromCharCode(97 + cropCtx.figIdx % 26)}.png`);
  $("crop-modal").style.display = "none";
  if (cropCtx.origin === "pages") gotoPage(cropCtx.pageId);
  else openProject(current, "figures");
}

async function autoRefine() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = "refining…";
  try {
    const r = await api(`/projects/${current}/figures/auto-refine`, {method:"POST"});
    alert(`${r.refined} figure crops refined by edge detection.`);
  } catch (e) { alert("auto-refine failed: " + e.message); }
  openProject(current, "figures");
}

async function figReacq(pageId, figIdx, flag = true, origin) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}` +
                  `/reshoot?flag=${flag}`, {method:"POST"});
  } catch (e) { alert("failed: " + e.message); return; }
  if (origin === "pages") gotoPage(pageId);
  else openProject(current, "figures");
}

async function delFigure(pageId, figIdx) {
  if (!confirm("Delete this figure from the book?")) return;
  await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}`, {method:"DELETE"});
  openProject(current, "figures");
}

async function rotateFigure(pageId, figIdx, dir) {
  await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}/rotate?dir=${dir}`,
            {method:"POST"});
  openProject(current, "figures");
}

async function setCaption(pageId, figIdx, caption) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}/caption`,
    {method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({caption})}); }
  catch (e) { alert("caption save failed: " + e.message); }
}

async function swapCaptions(pageId, a, b) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/swap-captions`,
    {method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({a, b})}); }
  catch (e) { alert("swap failed: " + e.message); return; }
  renderTab("figures", window._proj);
}

function renderFiguresTab(p, clusters) {
  const name = p.name, body = $("tabbody");
  const key = (pid, fi) => pid + "#" + fi;
  const clusterOf = {};
  clusters.forEach((cl, ci) => cl.forEach(m => clusterOf[key(m.page_id, m.fig_idx)] = ci));

  const rows = [];
  p.pages.forEach(pg => {
    if (pg.status === "duplicate" || pg.status === "deleted") return;
    (pg.figures || []).forEach((f, i) => {
      const letter = f.split("_").pop().split(".")[0];
      const ridx = letter.charCodeAt(0) - 97;
      rows.push({pg, f, i, caption: (pg.regions?.[ridx]?.caption) || "",
                 reacq: !!(pg.regions?.[ridx]?.needs_reshoot)});
    });
  });
  const groups = [];
  rows.forEach(r => {
    const last = groups[groups.length - 1];
    const num = r.pg.printed_number;
    if (last && num != null && last.num === num) last.rows.push(r);
    else groups.push({num, rows: [r]});
  });

  const figRow = (r, g) => {
    const gi = g.rows.indexOf(r), next = g.rows[gi + 1];
    const canSwap = next && next.pg.id === r.pg.id;   // swap within one page
    return `
      <div class="row" style="border-top:1px solid var(--line);padding:.7rem 0">
        <a href="javascript:void(0)" onclick="openCrop('${r.pg.id}', ${r.i})"
           title="click to re-crop">
          <img loading="lazy" decoding="async"
               src="/api/projects/${name}/thumb/${r.f}?w=380${fv(r.f)}"
               style="height:130px;border:1px solid var(--line);border-radius:4px;
                      cursor:crosshair"></a>
        <div style="flex:1;min-width:14rem">
          <div><a href="javascript:void(0)" onclick="gotoPage('${r.pg.id}')">
            <b>${r.pg.printed_number != null ? "page " + r.pg.printed_number
                : "unnumbered"}</b> <span class="meta">· ${r.pg.id}</span></a>
            ${r.reacq ? `<span class="badge acceptable">📷 re-acquire queued</span>` : ""}</div>
          <div class="row" style="margin-top:.3rem;align-items:flex-start">
            <textarea rows="3" placeholder="caption for this figure…"
                   style="flex:1;min-width:8rem;margin:0;min-height:0;resize:vertical"
                   onchange="setCaption('${r.pg.id}', ${r.i}, this.value)">${esc(r.caption)}</textarea>
            ${canSwap ? `<button class="secondary" title="swap this caption with the figure below"
                onclick="swapCaptions('${r.pg.id}', ${r.i}, ${next.i})">⇅ swap</button>` : ""}
          </div>
        </div>
        <span class="row">
          <button class="secondary" title="rotate 90° counter-clockwise"
                  onclick="rotateFigure('${r.pg.id}', ${r.i}, 'ccw')">⟲</button>
          <button class="secondary" title="rotate 90° clockwise"
                  onclick="rotateFigure('${r.pg.id}', ${r.i}, 'cw')">⟳</button>
          <button class="secondary" onclick="openCrop('${r.pg.id}', ${r.i})">Re-crop</button>
          <input type="file" accept="image/*" id="figup-${r.pg.id}-${r.i}"
                 style="display:none" onchange="uploadFigure('${r.pg.id}', ${r.i})">
          <button class="secondary" onclick="$('figup-${r.pg.id}-${r.i}').click()">Re-upload</button>
          <button class="secondary" onclick="figReacq('${r.pg.id}', ${r.i}, ${!r.reacq})">
            ${r.reacq ? "Unmark re-acquire" : "Re-acquire"}</button>
          <button class="danger" onclick="delFigure('${r.pg.id}', ${r.i})">Delete</button>
        </span>
      </div>`;
  };

  const groupHtml = (g) => {
    if (g.rows.length <= 1) return g.rows.map(r => figRow(r, g)).join("");
    const byCluster = {};
    g.rows.forEach(r => {
      const c = clusterOf[key(r.pg.id, r.i)];
      if (c != null) (byCluster[c] = byCluster[c] || []).push(r);
    });
    const dupBanners = Object.values(byCluster).filter(a => a.length > 1).map(a => `
      <div class="row" style="background:#fffbeb;border-radius:6px;padding:.35rem .7rem;margin:.35rem 0">
        <span class="meta" style="margin:0;color:#b45309">⚠ ${a.length} of these are the
          SAME figure captured twice</span>
        <button class="secondary" onclick='keepBest(${JSON.stringify(
          a.map(r => ({page_id: r.pg.id, fig_idx: r.i})))})'>Keep sharpest, delete the rest</button>
      </div>`).join("");
    return `<div style="border:1px solid var(--line);border-radius:8px;padding:.2rem .8rem;margin:.6rem 0">
      <div class="meta" style="padding:.4rem 0">${g.rows.length} figures on printed page ${g.num}
        — each keeps its own caption; use ⇅ swap if two captions are transposed</div>
      ${dupBanners}
      ${g.rows.map(r => figRow(r, g)).join("")}
    </div>`;
  };

  body.innerHTML = `<div class="card"><h2>Figures <span class="meta">
    (book order — re-crop, caption, replace, or delete)</span></h2>
    <div class="row" style="margin-bottom:.6rem">
      <button class="secondary" onclick="autoRefine()">✨ Auto-refine crops (edge detection)</button>
      <button onclick="aiRefine(this)" title="Claude proposes each figure's corners
from the page photo; current manual crops are never touched">🤖 AI refine crops (Claude)</button>
    </div>` +
    (groups.map(groupHtml).join("") || "<div class='meta'>no figures yet</div>")
    + `</div>` + cropModalHtml();
}

async function uploadFigure(pageId, figIdx) {
  const input = $(`figup-${pageId}-${figIdx}`);
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append("photo", input.files[0]);
  const r = await fetch(
    `/api/projects/${current}/pages/${pageId}/figures/${figIdx}/upload`,
    {method:"POST", body: fd});
  if (!r.ok) alert("upload failed");
  bumpFig(`figures/${pageId}_${String.fromCharCode(97 + figIdx % 26)}.png`);
  openProject(current, "figures");
}

async function keepBest(items) {
  if (!confirm(`Keep the sharpest of ${items.length} figures and delete the rest?`)) return;
  await api(`/projects/${current}/figures/keep-best`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({items})});
  openProject(current, "figures");
}

async function deletePage(pageId) {
  await api(`/projects/${current}/pages/${pageId}`, {method:"DELETE"});
  openProject(current, "pages");
}

async function restorePage(pageId) {
  await api(`/projects/${current}/pages/${pageId}/restore`, {method:"POST"});
  openProject(current, "pages");
}

refreshProjects();
</script>
</body>
</html>
