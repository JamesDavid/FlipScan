<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlipScan reader</title>
<style>
  * { box-sizing: border-box; }
  /* dvh tracks the browser chrome (URL bar) on phones — 100vh flows under it */
  body { margin:0; font-family: system-ui, sans-serif; background:#f5f5f4;
         height:100vh; height:100dvh;
         display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:.5rem; padding:.5rem .8rem;
           padding-top: calc(.5rem + env(safe-area-inset-top));
           background:#292524; color:#fafaf9; flex:none; flex-wrap:wrap; }
  header a { color:#5eead4; text-decoration:none; font-size:.9rem; }
  header .title { flex:1; text-align:center; font-size:.9rem; overflow:hidden;
                  text-overflow:ellipsis; white-space:nowrap; min-width:6rem; }
  header button, header select {
    background:#44403c; color:#fafaf9; border:0; border-radius:6px;
    padding:.35rem .7rem; font-size:.85rem; cursor:pointer; max-width:9rem; }
  /* stage centres the reading surface; in "comfortable" mode the frame fills
     it, in device mode the frame is a bezel scaled to the exact panel */
  #stage { flex:1; min-height:0; display:flex; align-items:center;
           justify-content:center; overflow:hidden; }
  #stage.device { background:#c9c6c2; }
  :root[data-theme="dark"] #stage.device { background:#000; }
  #frame { position:relative; width:100%; height:100%; }
  #frame.device { background:#111; border-radius:16px;
                  box-shadow:0 8px 34px rgba(0,0,0,.45); }
  #viewer { width:100%; height:100%; background:#fff; position:relative;
            overflow:hidden; }
  #viewer.eink { filter: grayscale(1) contrast(1.06) brightness(1.02); }
  footer { flex:none; padding:.3rem .8rem; font-size:.75rem; color:#78716c;
           text-align:center; background:#f5f5f4;
           padding-bottom: calc(.3rem + env(safe-area-inset-bottom)); }
  #loading { position:absolute; inset:0; display:flex; align-items:center;
             justify-content:center; color:#78716c; font-size:.95rem; }
  .pgbtn { position:absolute; top:50%; transform:translateY(-50%); z-index:6;
           width:2.4rem; height:2.4rem; border-radius:50%; border:0;
           background:rgba(120,113,108,.28); color:#fff; font-size:1.25rem;
           cursor:pointer; line-height:1; }
  .pgbtn:hover { background:rgba(13,148,136,.75); }
  #pg-prev { left:.4rem; } #pg-next { right:.4rem; }
  :root[data-theme="dark"] body { background:#0c0a09; }
  :root[data-theme="dark"] #viewer { background:#1c1917; }
  :root[data-theme="dark"] footer { background:#0c0a09; color:#a8a29e; }
</style>
</head>
<body>
<header>
  <a href="#" id="back">← back</a>
  <div class="title" id="title">loading…</div>
  <select id="toc" title="table of contents"><option>contents…</option></select>
  <select id="device" title="read comfortably, or simulate a device's screen">
    <option value="none">comfortable</option>
    <option value="remarkable-2">reMarkable 2</option>
    <option value="eink-6in">6″ e-ink</option>
    <option value="xteink-x3">Xteink X3</option>
    <option value="tablet">tablet</option>
  </select>
  <button id="theme" title="light / dark">🌗</button>
  <button id="font-minus" title="smaller text">A−</button>
  <button id="font-plus" title="larger text">A+</button>
  <button id="flag" title="something is wrong with this page of the book —
flag it for the reshoot list">⚑ flag</button>
</header>
<div id="stage">
  <div id="frame">
    <div id="viewer">
      <div id="loading">loading book…</div>
      <button class="pgbtn" id="pg-prev" title="previous page">‹</button>
      <button class="pgbtn" id="pg-next" title="next page">›</button>
    </div>
  </div>
</div>
<footer id="pos"></footer>

<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const project = params.get("project"), file = params.get("file");
document.getElementById("back").href =
  "/#" + encodeURIComponent(project || "") + "/pipeline";
if (!project || !file) {
  document.getElementById("loading").textContent = "missing ?project= and ?file=";
  throw new Error("bad params");
}
document.getElementById("title").textContent = file;

const book = ePub(`/api/projects/${encodeURIComponent(project)}/file/out/${encodeURIComponent(file)}`);
const rendition = book.renderTo("viewer", {
  width: "100%", height: "100%", spread: "none", allowScriptedContent: false });

// ---- light / dark
rendition.themes.register("light", {
  "body": {"background": "#ffffff", "color": "#1c1917"}});
rendition.themes.register("dark", {
  "body": {"background": "#1c1917 !important", "color": "#d6d3d1 !important"},
  "a": {"color": "#5eead4 !important"},
  "img": {"opacity": "0.92"}});
let theme = localStorage.getItem("flipscan-reader-theme")
  || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  rendition.themes.select(theme);
  localStorage.setItem("flipscan-reader-theme", theme);
}
applyTheme();
document.getElementById("theme").onclick = () => {
  theme = theme === "dark" ? "light" : "dark";
  applyTheme();
};

let fontPct = +(localStorage.getItem("flipscan-reader-font") || 100);
const applyFont = () => rendition.themes.fontSize(fontPct + "%");
applyFont();

// ---- device simulation: render at the panel's exact pixel size inside a
// bezel so you can see how the book looks on the real device, or "comfortable"
// to just read it filling the window. E-ink panels get a grayscale filter.
const DEVICE_PX = {
  "remarkable-2": {w: 1404, h: 1872, eink: true},
  "eink-6in":     {w: 758,  h: 1024, eink: true},
  "xteink-x3":    {w: 480,  h: 800,  eink: true},
  "tablet":       {w: 1200, h: 1600, eink: false},
};
let deviceView = localStorage.getItem("flipscan-reader-device") || "none";
function applyDeviceView() {
  const stage = document.getElementById("stage");
  const frame = document.getElementById("frame");
  const viewer = document.getElementById("viewer");
  const sel = document.getElementById("device");
  if (sel) sel.value = deviceView;
  const d = DEVICE_PX[deviceView];
  if (!d) {                                   // comfortable — fill the window
    stage.classList.remove("device");
    frame.classList.remove("device");
    frame.style.cssText = "";
    viewer.classList.remove("eink");
    viewer.style.cssText = "";
    try { rendition.resize("100%", "100%"); } catch (e) {}
    return;
  }
  const bez = 16;
  const fw = d.w + 2 * bez, fh = d.h + 2 * bez;
  const s = Math.max(0.05, Math.min((stage.clientWidth - 24) / fw,
                                    (stage.clientHeight - 24) / fh));
  stage.classList.add("device");
  frame.classList.add("device");
  frame.style.cssText = `width:${fw}px;height:${fh}px;padding:${bez}px;`
    + `transform:scale(${s});transform-origin:center center`;
  viewer.style.cssText = `width:${d.w}px;height:${d.h}px`;
  viewer.classList.toggle("eink", !!d.eink);
  try { rendition.resize(d.w, d.h); } catch (e) {}
}
document.getElementById("device").onchange = (e) => {
  deviceView = e.target.value;
  localStorage.setItem("flipscan-reader-device", deviceView);
  applyDeviceView();
};
let _devResize;
addEventListener("resize", () => {
  if (DEVICE_PX[deviceView]) {
    clearTimeout(_devResize);
    _devResize = setTimeout(applyDeviceView, 150);
  }
});

// resume where we left off (per book)
const posKey = `flipscan-reader-pos:${project}/${file}`;
rendition.display(localStorage.getItem(posKey) || undefined);

book.loaded.metadata.then(m => {
  if (m.title) document.getElementById("title").textContent = m.title;
});
book.loaded.navigation.then(nav => {
  const sel = document.getElementById("toc");
  sel.innerHTML = '<option value="">contents…</option>' + nav.toc.map(i =>
    `<option value="${i.href}">${i.label.trim()}</option>`).join("");
  sel.onchange = () => sel.value && rendition.display(sel.value);
});
book.ready.then(() => {
  document.getElementById("loading").style.display = "none";
  if (deviceView !== "none") applyDeviceView();   // restore a device view
  return book.locations.generate(900);   // enables the % position readout
}).then(() => updatePos(rendition.currentLocation()));

function updatePos(loc) {
  if (!loc || !loc.start) return;
  localStorage.setItem(posKey, loc.start.cfi);
  const pct = book.locations.length()
    ? Math.round(book.locations.percentageFromCfi(loc.start.cfi) * 100) : null;
  document.getElementById("pos").textContent =
    (pct == null ? "" : pct + "% — ") + "tap ‹ › or the page edges to turn";
  const sel = document.getElementById("toc");
  if (loc.start.href && sel.options.length) {
    for (const o of sel.options)
      if (o.value && loc.start.href.endsWith(o.value.split("#")[0]))
        { sel.value = o.value; break; }
  }
}
rendition.on("relocated", updatePos);

// Internal links (the book's own contents page!) must navigate via the
// rendition. epub.js gives each content doc a <base> of <origin>/EPUB/, so a
// link like "ch004.xhtml" natively resolves to <origin>/EPUB/ch004.xhtml — a
// URL the server 404s as JSON. We intercept clicks in the CAPTURE phase (so we
// beat the native navigation and epub.js's own link handler), resolve the
// target to a spine item, and drive the rendition instead. Only genuinely
// external links (a different origin) keep their default. Installed from BOTH
// the content hook and the core "rendered" event so it binds no matter which
// path epub.js takes; the guard flag prevents a double bind.
function bindInternalLinks(doc) {
  if (!doc || doc.__flipLinksBound) return;
  doc.__flipLinksBound = true;
  doc.addEventListener("click", (e) => {
    const a = e.target && e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    let url;
    try { url = new URL(a.href, doc.baseURI); } catch { return; }
    if (url.origin !== location.origin) return;    // real external site — leave it
    const path = url.pathname, frag = url.hash || "";
    const spineItems = (book.spine && book.spine.spineItems) || [];
    const item = spineItems.find(s =>
      path === s.canonical || path.endsWith("/" + s.href) || path.endsWith(s.href));
    if (!item) return;                             // not a book page — leave default
    e.preventDefault();
    e.stopImmediatePropagation();
    rendition.display(item.href + frag);
  }, true);   // capture phase — runs before epub.js's own handlers
}
rendition.on("rendered", (section, view) => {
  try { bindInternalLinks((view && view.document)
    || (view && view.contents && view.contents.document)); } catch (e) {}
});

// ---- per-figure controls: every figure is images/p0123_a.jpg — the name
// maps straight back to its page and crop slot in FlipScan
rendition.hooks.content.register(contents => {
  const doc = contents.document;
  // internal links (the book's contents page!) — see bindInternalLinks
  bindInternalLinks(doc);
  // tap zones live INSIDE the content so links and buttons always win —
  // the old invisible overlays sat on top and ate the TOC's clicks
  doc.addEventListener("click", (e) => {
    if (e.target.closest("a, button, select, input")) return;
    // clientX is viewport-relative; the VIEWPORT width is the visible page.
    // (documentElement.clientWidth is the whole columnized chapter — using
    // it made every tap deep in a chapter land in the 'previous' zone)
    const w = (doc.defaultView && doc.defaultView.innerWidth)
              || doc.documentElement.clientWidth || 1;
    const x = e.clientX / w;
    if (x < 0.3) rendition.prev();
    else if (x > 0.7) rendition.next();
  });
  doc.querySelectorAll("img").forEach(img => {
    // epub.js rewrites src to blob: URLs — identity rides in data-fig instead
    const m = (img.getAttribute("data-fig") || "").match(/^(p\d{4})_([a-z])$/);
    if (!m) return;
    const pid = m[1], idx = m[2].charCodeAt(0) - 97;
    const bar = doc.createElement("div");
    bar.setAttribute("style",
      "font-size:12px;margin:2px 0 12px;display:flex;gap:6px;justify-content:center");
    const mkBtn = (label, fn) => {
      const b = doc.createElement("button");
      b.textContent = label;
      b.setAttribute("style", "font-size:11px;padding:2px 8px;border-radius:6px;" +
        "border:1px solid #a8a29e;background:transparent;color:inherit;cursor:pointer");
      b.addEventListener("click", (e) => { e.preventDefault(); fn(b); });
      bar.appendChild(b);
    };
    mkBtn("✂ re-crop", () => {
      // hand off to the main app's crop tool on this figure — navigate this
      // tab (window.open gets eaten by mobile popup blockers); the reader
      // remembers its position so coming back is free
      localStorage.setItem("flipscan-open-crop",
        JSON.stringify({project, pageId: pid, figIdx: idx}));
      window.top.location.assign("/#" + encodeURIComponent(project) + "/pages");
    });
    mkBtn("📷 re-capture", async (b) => {
      try {
        const r = await fetch(`/api/projects/${encodeURIComponent(project)}` +
          `/pages/${pid}/figures/${idx}/reshoot`, {method: "POST"});
        if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
        b.textContent = "✓ queued for re-capture";
        b.disabled = true;
      } catch (e) { alert("failed: " + e.message); }
    });
    img.insertAdjacentElement("afterend", bar);
  });
});

// ---- flag the passage being read: the server matches the visible text back
// to its source page and puts that page on the reshoot list
function currentSnippet() {
  try {
    const loc = rendition.currentLocation();
    const range = rendition.getRange(loc.start.cfi);
    let text = (range.startContainer.textContent || "").slice(range.startOffset);
    if (text.length < 40)
      text = (range.startContainer.parentElement?.textContent || text);
    return text.slice(0, 300);
  } catch { return ""; }
}
document.getElementById("flag").onclick = async () => {
  const snippet = currentSnippet();
  if (snippet.trim().length < 12) {
    alert("Couldn't read the current passage — flip to a text page and retry.");
    return;
  }
  const note = prompt("Flag this spot — what's wrong? (optional note)");
  if (note === null) return;
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(project)}/reader-flag`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({snippet, note: note || null})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    alert(`Flagged ${d.printed_number != null ? "page " + d.printed_number : d.page}` +
          " — it's on the reshoot list and in the capture wizard.");
  } catch (e) { alert("flag failed: " + e.message); }
};

document.getElementById("pg-prev").onclick = () => rendition.prev();
document.getElementById("pg-next").onclick = () => rendition.next();
document.getElementById("font-minus").onclick = () => {
  fontPct = Math.max(60, fontPct - 10);
  localStorage.setItem("flipscan-reader-font", fontPct); applyFont();
};
document.getElementById("font-plus").onclick = () => {
  fontPct = Math.min(220, fontPct + 10);
  localStorage.setItem("flipscan-reader-font", fontPct); applyFont();
};
const keys = (e) => {
  if (e.key === "ArrowLeft") rendition.prev();
  if (e.key === "ArrowRight" || e.key === " ") rendition.next();
};
document.addEventListener("keyup", keys);
rendition.on("rendered", (s, view) =>   // keys must work inside the iframe too
  view.document.addEventListener("keyup", keys));
</script>
</body>
</html>
